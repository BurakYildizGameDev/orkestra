guide.step1.title: "1. Einrichtung & Konfiguration"
guide.step1.desc: "Führen Sie 'orkestra init' in Ihrem Terminal aus oder konfigurieren Sie über diese Oberfläche. Kommentare in orkestra.yaml bleiben erhalten."
guide.step2.title: "2. Stellen Sie Ihr Team zusammen"
guide.step2.desc: "Wählen Sie Ihren aktiven Lead-Agenten (Patron: Claude, agy oder Codex) und fügen Sie Worker-Anbieter hinzu (Ollama, OpenRouter, CLI-Agenten)."
guide.step3.title: "3. Sichern Sie Ihre API-Schlüssel"
guide.step3.desc: "Geben Sie Ihre API-Schlüssel im Schlüssel-Tab ein. Schlüssel werden sicher im Keyring des Betriebssystems gespeichert und niemals in Dateien geschrieben."
guide.step4.title: "4. Aufgaben delegieren"
guide.step4.desc: "Verwenden Sie 'orkestra run' für einzelne Aufgaben oder 'orkestra batch' für parallele Aufgaben. Meilensteine können mit 'orkestra handoff to' übergeben werden."
guide.step5.title: "5. Überwachen & Fehlerbehebung"

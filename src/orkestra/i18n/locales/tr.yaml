guide.title: "Nasıl Kullanılır"
guide.subtitle: "Orkestra'dan en iyi şekilde yararlanmak için adım adım kılavuz"
guide.step1.title: "1. Kurulum ve Yapılandırma"
guide.step1.desc: "Terminalde 'orkestra init' çalıştırın veya bu arayüzden ayarlayın. Yapılandırma yorumlarınız korunarak orkestra.yaml dosyasına yazılır."
guide.step2.title: "2. Ekibinizi Kurun"
guide.step2.desc: "Aktif şefinizi (Patron: Claude, agy veya Codex) seçin ve işçi sağlayıcıları (Ollama modelleri, OpenRouter bulut API'leri veya kod ajanları) ekleyin."
guide.step3.title: "3. API Anahtarlarını Güvene Alın"
guide.step3.desc: "Anahtarlar sekmesinden API anahtarlarınızı girin. Anahtarlar dosyalara veya commit'lere değil, doğrudan işletim sistemi kimlik deposuna kaydedilir."
guide.step4.title: "4. Görevleri Devredin"
guide.step4.desc: "Tek görevler için 'orkestra run', paralel işler için 'orkestra batch' kullanın. Şef ayrıca 'orkestra handoff to' ile etap devredebilir."
guide.step5.title: "5. İzleme ve Sorun Giderme"
guide.step5.desc: "Sağlayıcıları doğrulamak için 'orkestra doctor' çalıştırın, Gelişmiş sekmesinden devre kesicileri ve Kullanım sekmesinden istatistikleri izleyin."
guide.docs_link: "Detaylı dokümantasyon ve kılavuzlar için:"

# English catalog: source language and fallback for every other language.
# Flat "key: value" pairs. Placeholders use {name} and must match in every language.

cli.help: "Budget-aware task dispatcher that runs multiple AIs under one chief."
cli.version: "orkestra {version}"
cli.option.version: "Show the version and exit."
cli.option.lang: "Interface language: en, tr, de, es, fr."
cli.error.unsupported_language: "Unsupported language '{lang}'. Choose one of: {choices}."

errors.prefix: "Error: {message}"
errors.internal: "Unexpected internal error: {detail}"

cli.option.config: "Config file to use (instead of ORKESTRA_CONFIG or ~/.orkestra/config.yaml)."
cli.option.json: "Print one JSON document to stdout; messages go to stderr."
cli.init.help: "Create a config file from the example. Never overwrites without --force."
cli.init.option.force: "Overwrite an existing config file (the old one is kept as .bak)."
cli.init.option.project: "Write ./orkestra.yaml for this project instead of the global config."
cli.config.help: "Show or validate the configuration."
cli.config.show.help: "Show the merged configuration and the files it came from."
cli.config.validate.help: "Validate the configuration files."

init.created: "Created {path}."
init.overwritten: "Overwrote {path} (previous file: {backup})."
init.exists: "{path} already exists and was left unchanged. Use --force to overwrite it."
init.gitignore: "Added {entry} to {path}."
init.next: "Next: edit the file, then run 'orkestra config validate'."

config.sources: "Sources:"
config.sources.none: "No config file found; using built-in defaults."
config.source.flag: "--config"
config.source.env: "ORKESTRA_CONFIG"
config.source.global: "global"
config.source.project: "project"
config.valid: "Configuration is valid."

config.error.not_found: "Config file not found: {path}"
config.error.read: "Cannot read {path}: {reason}"
config.error.yaml: "{path}: invalid YAML: {problem}"
config.error.yaml_line: "{path}, line {line}: invalid YAML: {problem}"
config.error.not_mapping: "{path}: the top level must be a mapping (key: value)."
config.error.invalid: "Invalid configuration ({sources}):"
config.error.write: "Cannot write {path}: {reason}"

config.validation.or: "or"
config.validation.missing: "required field is missing"
config.validation.unknown_field: "unknown field"
config.validation.literal: "must be {expected}"
config.validation.int: "must be an integer"
config.validation.float: "must be a number"
config.validation.bool: "must be true or false"
config.validation.str: "must be text"
config.validation.mapping: "must be a mapping (key: value)"
config.validation.list: "must be a list"
config.validation.ge: "must be at least {limit}"
config.validation.le: "must be at most {limit}"
config.validation.provider_type_unknown: "unknown provider type '{tag}'; expected one of: {expected}"
config.validation.provider_type_missing: "'type' is required; expected one of: {expected}"
config.validation.provider_name: "invalid provider name '{name}': use only a-z, 0-9, '_' and '-'"
config.validation.sandbox_danger: "'danger-full-access' is not supported; use 'read-only' or 'workspace-write'"
config.validation.tier_order: "min_tier ({min}) must not be greater than max_tier ({max})"
config.validation.unknown_profile: "{field}: profile '{name}' is not defined in profiles"
config.validation.unknown_chief: "{field}: chief '{name}' is not defined in chiefs"

id: 12-bugfix-dates
difficulty: medium
category: bugfix
files: [dates.py]
prompt: |
  add_months() in dates.py crashes for dates at the end of a month (2026-01-31 plus one
  month) and goes wrong across years. Fix it: the result keeps the day when the target month
  has it, otherwise it is the last day of that month (2024-01-31 + 1 -> 2024-02-29). Negative
  months go back. business_days_between() counts the weekend wrongly; it must count Monday to
  Friday days in [start, end) and return a negative count when end is before start.
